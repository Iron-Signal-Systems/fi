name: One-time FI obsolete FreeBSD branch cleanup
on:
  push:
    branches: [dev-backend]
    paths: ['.github/workflows/fi-obsolete-branch-cleanup.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-expired-backend-branches:
    if: github.repository == 'Iron-Signal-Systems/fi' && github.ref == 'refs/heads/dev-backend'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Delete only the explicit obsolete backend refs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # This exact review list is intentionally static, NOT branch wildcards.
          branches=(
            'dev/c1-ab-independent-20261120'
            'dev/c1-async-relational-verify-20261120'
            'dev/c1-commit-ready-verify-20261120'
            'dev/c1-continuous-p5-signed-stream-20261120'
            'dev/c1-eight-gib-window-20261119'
            'dev/c1-five-family-ingestion-20261118'
            'dev/c1-full-backlog-4g-20261119'
            'dev/c1-full-backlog-usn-order-20261119'
            'dev/c1-pgwal-8g-20261120'
            'dev/c1-pgwal-buffers16m-20261120'
            'dev/c1-shared-adaptive-sql-20261119'
            'dev/c1-sor-single-jail-20261124'
            'dev/c1-two-process-20261120'
            'experiment/fi-atomic-family-buffers-p6-20261116'
            'experiment/fi-candidate-a-w512-2g-20261113'
            'experiment/fi-deferred-verified-clone-20261106'
            'experiment/fi-dynamic-priority-2-16-w512-20261116'
            'experiment/fi-family-general4-w512-20261116'
            'experiment/fi-family-processors-w512-20261115'
            'experiment/fi-file-validation-once-20261108'
            'experiment/fi-general-four-each-w512-20261116'
            'experiment/fi-h16-parallel-a-w3-w12-20261113'
            'experiment/fi-header-first-ingest-20261115'
            'experiment/fi-p6-file-proof-repair-20261116'
            'experiment/fi-p6-five-concurrent-sql-writers-20261116'
            'experiment/fi-p8-reuse-verified-artifact-20261117'
            'experiment/fi-p9-direct-five-family-stream-20261117'
            'experiment/fi-p10-p6-native-direct-20261117'
            'experiment/fi-p11-p5-p6-native-five-family-20261118'
            'experiment/fi-p11-security-copy-profile-20261118'
            'experiment/fi-p12-security-field-envelope-20261118'
            'experiment/fi-persistent-family-p5-w512-20261116'
            'experiment/fi-priority-fill-2-16-w512-20261116'
            'experiment/fi-security-sweep-8-16-w512-20261116'
            'experiment/fi-w256-memory4g-chunk-matrix-20261107'
            'fix/fi-p7-five-writer-k32-context-20261117'
            'freebsd-backend-multisource-20261011'
            'promote/dev-backend-accepted-20261127'
            'stage/backlog-artifact-ledger-20261101'
            'stage/backlog-file-window-20261101'
            'stage/backlog-private-relational-shadow-20261101'
            'stage/backlog-private-window-stage-20261101'
            'stage/backlog-projection-cursor-20261101'
            'stage/backlog-security-coverage-20261101'
            'stage/backlog-security-window-20261101'
            'stage/backlog-source-window-20261101'
            'stage/backlog-typed-window-20261101'
            'stage/backlog-usn-bounded-20261101'
            'stage/backlog-usn-cross-window-20261101'
            'stage/multibatch-generation-size-20261101'
            'stage/outage-backlog-inventory-20261101'
            'stage/signed-backlog-checkpoint-contract-20261101'
            'stage/signed-backlog-window-plan-20261101'
            'work/fi-joined-private-performance-20261102'
            'work/freebsd-crl-refresh-20261028'
            'work/ingest-copy-call-latency-20261028'
            'work/ingest-serial-pipeline-20261031'
            'work/ingest-single-worker-efficiency-local-20261030'
            'work/receiver-recorded-fast-recovery-20261029'
            'work/single-worker-sql-efficiency-20261030'
          )
          for branch in "${branches[@]}"; do
            echo "DELETE old FI branch: $branch"
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"
          done
          echo "Deleted ${#branches[@]} explicitly listed obsolete backend branches."
