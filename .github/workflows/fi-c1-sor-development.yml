# C1 is unreleased development. This job compiles the staged SQL and
# preparation implementation without deploying anything to the C220 jails.
name: FI C1 SoR Integration Compile

on:
  push:
    branches:
      - dev/c1-two-process-20261120
    paths:
      - 'go/internal/recordingest/**'
      - 'go/internal/c1handoff/**'
      - 'go/cmd/fi-ingest-worker/**'
      - 'go/cmd/fi-c1-sor-worker/**'
      - 'go/cmd/fi-c1-ingest-worker/**'
      - 'go/cmd/fi-c1-host-preflight/**'
      - '.github/workflows/fi-c1-sor-development.yml'
  workflow_dispatch:

# Only the newest C1 development commit needs a compile gate.
# Cancel obsolete branch runs so they do not saturate our FreeBSD CI queue.
concurrency:
  group: fi-c1-sor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  c1-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: go
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true
          cache-dependency-path: go/go.sum
      - name: Test bounded C1 inter-jail protocol
        run: go test -race ./internal/c1handoff -count=1
      - name: Compile C1 ported SoR and independent verifier
        run: go test -race -tags fi_c1_sor_dev ./internal/recordingest -run '^TestC1' -count=1
      - name: Cross-compile C1 fi-ingest service implementation
        run: GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build -tags fi_c1_sor_dev -o /tmp/fi-c1-ingest-worker ./cmd/fi-c1-ingest-worker
      - name: Cross-compile fi-sor native C1 SQL worker for FreeBSD
        run: GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build -tags fi_c1_sor_dev -o /tmp/fi-c1-sor-worker ./cmd/fi-c1-sor-worker
      - name: Cross-compile host tmpfs and jail nullfs read-only preflight for FreeBSD
        run: GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build -tags fi_c1_sor_dev -o /tmp/fi-c1-host-preflight ./cmd/fi-c1-host-preflight
      - name: Cross-compile C1 ingest worker for FreeBSD
        run: GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build -tags fi_c1_sor_dev -o /tmp/fi-ingest-worker-c1 ./cmd/fi-ingest-worker
      - name: Cross-compile fi-ingest-worker for FreeBSD
        run: GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/fi-ingest-worker ./cmd/fi-ingest-worker
