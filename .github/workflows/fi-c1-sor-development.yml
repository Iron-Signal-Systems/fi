# C1 is unreleased development. This job compiles the staged SQL and
# preparation implementation without deploying anything to the C220 jails.
name: FI C1 SoR Integration Compile

on:
  push:
    branches:
      - dev/c1-two-process-20261120
      - dev/c1-sor-single-jail-20261124
    paths:
      - 'go/internal/generationrecorder/**'
      - 'go/internal/transportreceiver/**'
      - 'go/cmd/fi-receiver/**'
      - 'go/internal/recordingest/**'
      - 'go/internal/c1handoff/**'
      - 'go/cmd/fi-ingest-worker/**'
      - 'go/cmd/fi-c1-sor-worker/**'
      - 'go/cmd/fi-c1-sor-local/**'
      - 'go/cmd/fi-c1-sor-clone-bootstrap/**'
      - 'tools/deployment/freebsd/fi-c1-sor-local-*'
      - 'go/cmd/fi-c1-ingest-worker/**'
      - 'tools/deployment/freebsd/build-fi-c1-dev.sh'
      - 'go/cmd/fi-c1-host-preflight/**'
      - 'go/cmd/fi-c1-private-schema/**'
      - 'go/cmd/fi-backlog-recover/diagnostics/fi_c1_*_c220.sh'
      - 'go/cmd/fi-backlog-recover/diagnostics/fi_c1_c220_stop_obsolete_ingest_jail.sh'
      - 'go/cmd/fi-backlog-recover/diagnostics/fi_c1_c220_receiver_sor_readiness_audit.sh'
      - 'go/cmd/fi-backlog-recover/diagnostics/fi_c1_c220_receiver_cache_mount_install.sh'
      - 'docs/fi-c1-c220-receiver-sor-readiness.md'
      - 'go/cmd/fi-backlog-recover/diagnostics/fi_c1_c220_stage_single_sor.sh'
      - 'go/cmd/fi-backlog-recover/diagnostics/fi_c1_c220_activate_sor_ready_mount.sh'
      - 'go/cmd/fi-backlog-recover/diagnostics/fi_c1_c220_prepare_sor_clone.sh'
      - 'go/cmd/fi-backlog-recover/diagnostics/fi_c1_c220_run_single_sor_clone_benchmark.sh'
      - 'go/cmd/fi-backlog-recover/diagnostics/fi_c1_c220_sql_write_profile_readonly.sh'
      - 'docs/performance/fi-c1-sor-go-sql-write-review-20261126.md'
      - 'go/cmd/fi-backlog-recover/diagnostics/fi_c1_c220_jail_names_ci.sh'
      - 'go/internal/freebsd/backendinstall/c1_private_projection_migration_sources.go'
      - 'go/internal/freebsd/backendinstall/c1_ram_mount_security.go'
      - 'go/internal/freebsd/backendinstall/c1_ram_mount_security_test.go'
      - 'go/internal/freebsd/backendinstall/c1_ram_mount_size.go'
      - 'go/internal/freebsd/backendinstall/c1_ram_mount_size_test.go'
      - 'go/internal/freebsd/backendinstall/c1_ram_mount_fstab_audit.go'
      - 'go/internal/freebsd/backendinstall/c1_ram_mount_fstab_audit_test.go'
      - 'go/internal/freebsd/backendinstall/c1_ram_host_runtime_install.go'
      - 'go/internal/freebsd/backendinstall/c1_ram_host_runtime_install_test.go'
      - 'go/internal/freebsd/backendinstall/c1_ram_fstab_install.go'
      - 'go/internal/freebsd/backendinstall/c1_ram_fstab_install_test.go'
      - 'go/internal/freebsd/backendinstall/c1_ram_mount_plan.go'
      - 'go/internal/freebsd/backendinstall/c1_ram_mount_plan_test.go'
      - 'go/internal/freebsd/backendinstall/c1_development_binary_install.go'
      - 'go/internal/freebsd/backendinstall/c1_development_binary_install_test.go'
      - 'go/internal/freebsd/backendinstall/c1_sor_identity_install.go'
      - 'go/internal/freebsd/backendinstall/c1_sor_identity_install_test.go'
      - 'go/internal/freebsd/backendinstall/c1_development_runtime_install.go'
      - 'go/internal/freebsd/backendinstall/c1_development_runtime_install_test.go'
      - 'go/cmd/fi-backend-install/main_freebsd.go'
      - '.github/workflows/fi-c1-sor-development.yml'
  workflow_dispatch:

# Only the newest C1 development commit needs a compile gate.
# Cancel obsolete branch runs so they do not saturate our FreeBSD CI queue.
concurrency:
  group: fi-c1-sor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  c1-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: go
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate exact FreeBSD C1 native binary stage shell
        working-directory: .
        run: sh -n tools/deployment/freebsd/build-fi-c1-dev.sh
      - name: Verify single-jail host scripts are syntactically valid
        working-directory: .
        run: |
          sh -n go/cmd/fi-backlog-recover/diagnostics/fi_c1_c220_stop_obsolete_ingest_jail.sh
          sh -n go/cmd/fi-backlog-recover/diagnostics/fi_c1_c220_direct_canonical_real_generation.sh
          sh -n go/cmd/fi-backlog-recover/diagnostics/fi_c1_c220_receiver_sor_readiness_audit.sh
          sh -n go/cmd/fi-backlog-recover/diagnostics/fi_c1_c220_receiver_cache_mount_install.sh
          sh go/cmd/fi-backlog-recover/diagnostics/fi_c1_c220_receiver_cache_mount_install.sh --selftest
          sh go/cmd/fi-backlog-recover/diagnostics/fi_c1_c220_receiver_sor_readiness_audit.sh --selftest
          sh -n go/cmd/fi-backlog-recover/diagnostics/fi_c1_c220_stage_single_sor.sh
          sh -n go/cmd/fi-backlog-recover/diagnostics/fi_c1_c220_activate_sor_ready_mount.sh
          sh -n go/cmd/fi-backlog-recover/diagnostics/fi_c1_c220_prepare_sor_clone.sh
          sh -n go/cmd/fi-backlog-recover/diagnostics/fi_c1_c220_run_single_sor_clone_benchmark.sh
          sh -n go/cmd/fi-backlog-recover/diagnostics/fi_c1_c220_sql_write_profile_readonly.sh
          sh go/cmd/fi-backlog-recover/diagnostics/fi_c1_c220_run_single_sor_clone_benchmark.sh --selftest
          sh go/cmd/fi-backlog-recover/diagnostics/fi_c1_c220_activate_sor_ready_mount.sh --selftest
          sh -n tools/deployment/freebsd/fi-c1-sor-local-run.sh
          sh -n tools/deployment/freebsd/fi-c1-sor-local-rc.sh
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true
          cache-dependency-path: go/go.sum
      - name: Verify C220 C1 read-only preflights resolve the unique real SoR jail
        working-directory: .
        run: sh go/cmd/fi-backlog-recover/diagnostics/fi_c1_c220_jail_names_ci.sh
      - name: Test bounded C1 inter-jail protocol
        run: |
          go test -race ./internal/c1handoff -count=1
          go test -race ./internal/c1handoff -run TestC1AuthenticatedFinalProofDistinctFromSQLAck -count=25
      - name: Test receiver-authenticated batch publication and receipt custody
        run: |
          go test -race -count=1 ./internal/generationrecorder
          GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/fi-c1-receiver ./cmd/fi-receiver
      - name: Compile C1 ported SoR and independent verifier
        run: go test -race -tags fi_c1_sor_dev ./internal/recordingest -run '^TestC1' -count=1
      - name: Cross-compile C1 fi-ingest service implementation
        run: GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build -tags fi_c1_sor_dev -o /tmp/fi-c1-ingest-worker ./cmd/fi-c1-ingest-worker
      - name: Cross-compile fi-sor native C1 SQL worker for FreeBSD
        run: GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build -tags fi_c1_sor_dev -o /tmp/fi-c1-sor-worker ./cmd/fi-c1-sor-worker
      - name: Cross-compile fi-sor single-jail native C1 worker (no fi-ingest jail)
        run: GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build -tags fi_c1_sor_dev -o /tmp/fi-c1-sor-local ./cmd/fi-c1-sor-local
      - name: Cross-compile isolated PostgreSQL18 clone-only fi-sor C1 schema installer
        run: GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build -tags fi_c1_sor_dev -o /tmp/fi-c1-sor-clone-bootstrap ./cmd/fi-c1-sor-clone-bootstrap
      - name: Run single-jail signed planning and direct-SQL safety tests
        run: go test -race -tags fi_c1_sor_dev ./internal/recordingest -run '^TestC1SoR(Local|CloneGate)' -count=1
      - name: Test mounted tmpfs FreeBSD noexec nosuid owner/GID
        run: go test ./internal/freebsd/backendinstall -run '^TestC1RAMMountSecurity' -count=1
      - name: Test mounted tmpfs actual block limit
        run: go test ./internal/freebsd/backendinstall -run '^TestC1RAMFilesystemStatfsLimit' -count=1
      - name: Test C1 host tmpfs startup ordered before FreeBSD jails and disabled
        run: go test ./internal/freebsd/backendinstall -run '^TestC1RAMHostRuntime' -count=1
      - name: Test C1 atomic C220 RAM fstab apply (temp files only)
        run: go test ./internal/freebsd/backendinstall -run '^TestC1RAMFSTAB(Atomic|Preflight|Rejects)' -count=1
      - name: Test C1 mount fstab collision rejection (no mutations)
        run: go test ./internal/freebsd/backendinstall -run '^TestC1RAMFSTAB' -count=1
      - name: Test C1 volatile host tmpfs and RO fi-sor nullfs mount plan
        run: go test ./internal/freebsd/backendinstall -run '^TestC1RAMMountPlan' -count=1
      - name: Test C1 FreeBSD development installer plan (no host mutation)
        run: go test ./internal/freebsd/backendinstall -run '^TestC1(DevelopmentBinary|SoRServiceIdentity|DevelopmentRuntime)' -count=1
      - name: Prove immutable private schema DDL plan and transaction gates
        run: go test -tags fi_c1_sor_dev ./internal/recordingest -run '^TestC1PrivateSchema' -count=1
      - name: Cross-compile C1 offline private-schema admin tool for FreeBSD
        run: GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build -tags fi_c1_sor_dev -o /tmp/fi-c1-private-schema ./cmd/fi-c1-private-schema
      - name: Cross-compile host tmpfs and jail nullfs read-only preflight for FreeBSD
        run: GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build -tags fi_c1_sor_dev -o /tmp/fi-c1-host-preflight ./cmd/fi-c1-host-preflight
      - name: Cross-compile FreeBSD backend installer with explicit C1 staging commands
        run: GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/fi-backend-install-c1 ./cmd/fi-backend-install
      - name: Cross-compile C1 ingest worker for FreeBSD
        run: GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build -tags fi_c1_sor_dev -o /tmp/fi-ingest-worker-c1 ./cmd/fi-ingest-worker
      - name: Cross-compile fi-ingest-worker for FreeBSD
        run: GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/fi-ingest-worker ./cmd/fi-ingest-worker

  c1-replay-postgres:
    name: C1 read-only power-loss reconciliation in disposable PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fi_c1_replay_integration
          POSTGRES_USER: fi_c1_test
          POSTGRES_PASSWORD: isolated-only-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fi_c1_test -d fi_c1_replay_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true
          cache-dependency-path: go/go.sum
      - name: Test crash after SourceParent and typed commits with actual read-only reconciliation
        env:
          FI_C1_REPLAY_CI_ALLOW_ISOLATED_WRITES: '1'
          FI_C1_REPLAY_PG_DSN: 'host=127.0.0.1 port=5432 user=fi_c1_test password=isolated-only-test dbname=fi_c1_replay_integration sslmode=disable'
        run: go test -tags 'fi_c1_sor_dev fi_c1_replay_pg_integration' -count=1 -run '^TestC1RecoveredSourceParentAndTypedRootPostgres18$' -v ./internal/recordingest

  c1-schema-postgres:
    name: C1 private schema atomic rollback in disposable PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fi
          POSTGRES_USER: fi_c1_schema_test
          POSTGRES_PASSWORD: isolated-only-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fi_c1_schema_test -d fi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true
          cache-dependency-path: go/go.sum
      - name: Full private 49-table and recovery DDL, forced rollback, canonical unchanged
        env:
          FI_C1_SCHEMA_CI_ALLOW_DISPOSABLE: '1'
          FI_C1_SCHEMA_CI_ADMIN_DSN: 'host=127.0.0.1 port=5432 user=fi_c1_schema_test password=isolated-only-test dbname=fi sslmode=disable'
        run: go test -tags 'fi_c1_sor_dev fi_c1_schema_pg_integration' -count=1 -run '^TestC1PrivateSchemaRealPostgres18AtomicDDL$' -v ./internal/recordingest
