name: FI P10 Native P6 Source Syntax

on:
  push:
    branches:
      - experiment/fi-p10-p6-native-direct-20261117
    paths:
      - 'go/cmd/fi-backlog-recover/testdata/family-p10/**'
      - '.github/workflows/fi-p10-native-source-syntax.yml'
  workflow_dispatch:

jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Parse P10 direct P6 Go source without modifying files
        shell: bash
        run: |
          set -euo pipefail
          for f in go/cmd/fi-backlog-recover/testdata/family-p10/*.go; do
            gofmt -e "$f" >/dev/null
            echo "P10 syntax PASS: $f"
          done
