name: FI W512 2GiB Private Candidate A Source and Seed Runner Gate

on:
  push:
    branches:
      - experiment/fi-candidate-a-w512-2g-20261113
    paths:
      - 'go/internal/recordingest/backlog_window_plan_w512_test.go'
      - 'go/cmd/fi-backlog-recover/patchers/w512_2g/**'
      - 'go/cmd/fi-backlog-recover/testdata/w512-2g/**'
      - 'go/cmd/fi-backlog-recover/testdata/w512_2g_private_field_*.sql'
      - 'go/cmd/fi-backlog-recover/run_private_h16_parallel_a_w512_seed_host.sh'
      - 'go/cmd/fi-backlog-recover/run_private_h16_parallel_a_w512_pilot2_host.sh'
      - 'go/cmd/fi-backlog-recover/run_private_h16_parallel_a_w512_wal_*_host.sh'
      - 'go/cmd/fi-backlog-recover/run_private_h16_parallel_a_w512_inflight16_host.sh'
      - 'go/cmd/fi-backlog-recover/patchers/w512_inflight16/**'
      - 'go/cmd/fi-backlog-recover/patchers/w512_worker_sweep/**'
      - 'go/cmd/fi-backlog-recover/run_private_h16_parallel_a_w512_worker_sweep_host.sh'
      - '.github/workflows/fi-w512-2g-seed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-parallel-a-w512:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: go/go.sum
      - name: Reconstruct frozen H16 combined ingest source in disposable tree
        shell: bash
        run: |
          set -euo pipefail
          # The historical SHA-once patcher deliberately refuses arbitrary
          # working directories. Satisfy its already-established disposable
          # fi-window-bench-*/optimized-source ownership contract in CI.
          bench="$(mktemp -d /tmp/fi-window-bench-h16-ci-XXXXXXXX)"
          stage="$bench/optimized-source"
          mkdir -p "$stage"
          base=b01ff0d8cb6559797de052f34b18bd84a395dc4c
          overlay=e47b5383e19140090d691b7c20e8d6ef6e0113fa
          combined=58f5d7341ba728b4696d05ba31199cb38226befc
          git archive "$base" | tar -x -C "$stage"
          for path in \
            go/cmd/fi-backlog-recover/main_freebsd.go \
            go/internal/recordingest/file_bulk_profiles.go \
            go/internal/recordingest/private_file_hash_h16_test.go; do
            git show "$overlay:$path" > "$stage/$path"
          done
          # Recreate the exact historical, reviewed SHA-once source overlay.
          git cat-file blob 704ad5ae6d93f036fc821724834747d35f5ab7d2 > "$stage/go/internal/recordingest/private_batch_hash_once.go"
          git cat-file blob fc437741ab4d7ae4a45099c1aa45f85a19735f10 > "$stage/go/internal/recordingest/private_batch_hash_once_test.go"
          git cat-file blob bff7343872bbca3c214bce0a79c92ec2b8039d0f > "$stage/patch_private_batch_hash_once.go"
          (cd "$stage/go" && go run "$stage/patch_private_batch_hash_once.go" "$stage")
          # Historical Security JSON-once source and tests, unchanged.
          git cat-file blob 9d7ba5fd99dc79d859023885810a95e869b8c1f1 > "$stage/go/internal/recordingest/security_single_pass_candidate.go"
          git cat-file blob d8b7603774f91209471ce42e311caf45f3d3fd9e > "$stage/go/internal/recordingest/security_json_once_test.go"
          git cat-file blob e2926386e039f05ce52d9cd44b75c56e81133d53 > "$stage/go/internal/recordingest/security_json_once_signed_cache_test.go"
          # Existing frozen H16 mixed-buffer source patch.
          git cat-file blob a1170aa8f7e3e40ee8f4702a54c6ced006386a23 > "$stage/go/internal/recordingest/private_mixed_family_buffers.go"
          git cat-file blob a841233fcaa176b49448434795141263ca163bae > "$stage/go/internal/recordingest/private_mixed_family_buffers_test.go"
          git cat-file blob 3f29c387c190ffdf8c6a331ceb4dc6a2b8d6609a > "$stage/patch_mixed_family_buffers.go"
          (cd "$stage/go" && go run "$stage/patch_mixed_family_buffers.go" "$stage")
          # Existing frozen H16 coverage/USN dependency patch.
          git cat-file blob 089bbf0af7ef50d1c5815cbd59e13833068236c2 > "$stage/go/internal/recordingest/private_dependency_buffers.go"
          git cat-file blob c9f4466364c1a5b6b1a0ae1f7b7f4dfbdf344866 > "$stage/go/internal/recordingest/private_dependency_buffers_test.go"
          git cat-file blob ec72725173fd97e961b82de1e5890b6ed47654f1 > "$stage/go/internal/recordingest/private_mixed_family_buffers.go"
          git cat-file blob 3548edb0945eb7213974b0edfa78e6f21efbf8f7 > "$stage/go/internal/recordingest/private_mixed_family_buffers_test.go"
          git cat-file blob b081f1c928e217d82e37ebbfb48025a863fbe3a7 > "$stage/patch_private_dependency_buffers.go"
          (cd "$stage/go" && go run "$stage/patch_private_dependency_buffers.go" "$stage")
          # The ONLY new functional code: no K32-triggered partial family drain.
          path=go/cmd/fi-backlog-recover/patchers/h16_combined_buffer/main.go
          mkdir -p "$stage/$(dirname "$path")"
          git show "$combined:$path" > "$stage/$path"
          path=go/internal/recordingest/h16_combined_family_buffers_test.go
          git show "$combined:$path" > "$stage/$path"
          (cd "$stage/go" && go run ./cmd/fi-backlog-recover/patchers/h16_combined_buffer/main.go "$stage")
          # Exact, previously exercised AB10 durable callback extension on
          # Overlays affect only the temporary original-H16 source tree.
          for path in \
            go/cmd/fi-backlog-recover/patchers/h16_parallel_a/main.go \
            go/cmd/fi-backlog-recover/testdata/h16-parallel-a/private_parallel_preparation.go \
            go/cmd/fi-backlog-recover/testdata/h16-parallel-a/private_parallel_preparation_test.go; do
            mkdir -p "$stage/$(dirname "$path")"
            git show "HEAD:$path" > "$stage/$path"
            [ "$(git hash-object "$stage/$path")" = "$(git rev-parse HEAD:"$path")" ]
          done
          (cd "$stage/go" && go run ./cmd/fi-backlog-recover/patchers/h16_parallel_a/main.go "$stage")
          (cd "$stage/go" && gofmt -w \
            internal/recordingest/private_parallel_preparation.go \
            internal/recordingest/private_parallel_preparation_test.go \
            internal/recordingest/postgres_ingest.go \
            cmd/fi-backlog-recover/main_freebsd.go)
          (cd "$stage/go" && go test -count=1 ./internal/recordingest \
            -run '^(TestPrivateParallelA|TestH16Combined|TestPrivateDependency|TestPrivateMixed|TestMixedBulk|TestPrivateBatchHashOnce|TestSecurityJSONOnce)')
          (cd "$stage/go" && go test -race -count=1 -timeout=120s ./internal/recordingest \
            -run '^TestPrivateParallelA')
          (cd "$stage/go" && GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build \
            -o "$stage/fi-h16-parallel-a-freebsd" ./cmd/fi-backlog-recover)
          test -s "$stage/fi-h16-parallel-a-freebsd"
          grep -Fq 'private-parallel-prep-a' "$stage/go/cmd/fi-backlog-recover/main_freebsd.go"
          echo "FI H16 PARALLEL A SOURCE PASS workers=2 in_flight=4 postgres_writers=1 original_W128_atomic=true signed_W3_W4=not_run"

          # W512 source patcher deliberately allows only the dedicated private
          # FreeBSD fixture path. Relocate the disposable prepared tree there;
          # neither the active repo checkout nor the W128 source is modified.
          sudo install -d -m 0755 -o "$(id -un)" -g "$(id -gn)" /home/jwood
          bench_w512="/home/jwood/fi-window-bench-w512-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$bench_w512"
          mv "$bench" "$bench_w512"
          stage="$bench_w512/optimized-source"
          for file in \
            go/cmd/fi-backlog-recover/patchers/w512_2g/main.go \
            go/internal/recordingest/backlog_window_plan_w512_test.go \
            go/cmd/fi-backlog-recover/testdata/w512-2g/private_w512_verified_seed.go \
            go/cmd/fi-backlog-recover/testdata/w512-2g/private_w512_verified_seed_test.go; do
            mkdir -p "$stage/$(dirname "$file")"
            git show "HEAD:$file" > "$stage/$file"
            test "$(git hash-object "$stage/$file")" = "$(git rev-parse "HEAD:$file")"
          done
          cp "$stage/go/cmd/fi-backlog-recover/testdata/w512-2g/private_w512_verified_seed.go" \
            "$stage/go/internal/recordingest/private_w512_verified_seed.go"
          cp "$stage/go/cmd/fi-backlog-recover/testdata/w512-2g/private_w512_verified_seed_test.go" \
            "$stage/go/internal/recordingest/private_w512_verified_seed_test.go"
          (cd "$stage/go" && go run ./cmd/fi-backlog-recover/patchers/w512_2g/main.go "$stage")
          (cd "$stage/go" && gofmt -w \
            ./cmd/fi-backlog-recover/main_freebsd.go \
            ./internal/recordingest/backlog_continuous_private.go \
            ./internal/recordingest/backlog_stream_load.go \
            ./internal/recordingest/backlog_window_plan_w512_test.go \
            ./internal/recordingest/private_w512_verified_seed.go \
            ./internal/recordingest/private_w512_verified_seed_test.go)
          (cd "$stage/go" && go test -count=1 ./internal/recordingest \
            -run '^(TestPrivateW512ReceiverAdmittedCache|TestBacklogWindowsW512TwoGiB|TestBacklogWindows128K|TestPrivateParallelA|TestH16Combined)')
          (cd "$stage/go" && GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build \
            -o "$stage/fi-w512-candidate-a-freebsd" ./cmd/fi-backlog-recover)
          test -s "$stage/fi-w512-candidate-a-freebsd"
          grep -Fq 'private-w512-2g' "$stage/go/cmd/fi-backlog-recover/main_freebsd.go"
          grep -Fq 'private-w512-verified-cache-seed' "$stage/go/cmd/fi-backlog-recover/main_freebsd.go"
          grep -Fq 'LoadPrivateW512FirstWindowFromAdmittedCache' "$stage/go/cmd/fi-backlog-recover/main_freebsd.go"
          grep -Fq 'LoadPrivateW512FirstWindowFromAdmittedCache' "$stage/go/internal/recordingest/private_w512_verified_seed.go"
          grep -Fq 'MaxRecords: 524288, MaxDataBytes: 2 << 30' "$stage/go/cmd/fi-backlog-recover/main_freebsd.go"
          echo "FI W512 2G SOURCE GATE PASS records=524288 bytes=2147483648 workers=2 W128_control_unchanged=true signed_replay=not_run"

      - name: W512 seed runner shell syntax and fail-closed isolation contract
        shell: bash
        run: |
          set -euo pipefail
          runner=go/cmd/fi-backlog-recover/run_private_h16_parallel_a_w512_seed_host.sh
          sh -n "$runner"
          test "$(grep -cx "JAIL" "$runner")" = 1
          # Regression: the previous pinned runner failed before the W512
          # source overlay because the nested testdata parent did not exist.
          # Assert real parent-directory creation precedes Git extraction.
          awk '
            /^w512patch=/ { in_assets=1 }
            in_assets && /testdata\/w512-2g" \\/ { parent_created=NR }
            in_assets && /^for spec in \\/ {
              if (parent_created && parent_created < NR) exit 0
              exit 1
            }
          ' "$runner"
          grep -Fq "W512 disposable Go asset directories unavailable" "$runner"
          grep -Fq -- '-private-w512-2g' "$runner"
          grep -Fq -- '-private-w512-verified-cache-seed' "$runner"
          grep -Fq -- '-verified-cache-root="$cache"' "$runner"
          grep -Fq 'FI W512 RECEIVER-ADMITTED CACHE BOOTSTRAP PASS' "$runner"
          grep -Fq -- '-window-profile=W512' "$runner"
          grep -Fq 'W512 VERIFIED-CACHE FIRST-WINDOW SEED START' "$runner"
          grep -Fq 'FI W512/2G FRESH SIGNED SEED ACCEPTED' "$runner"
          grep -Fq 'original_W128_seed_reused=false' "$runner"
          grep -Fq 'W512 SECURITY DEFINER helper functions missing' "$runner"
          grep -Fq 'if basePort != 55981 {' "$runner"
          grep -Fq 's/if basePort != 55981 {/if basePort != 55983 {/' "$runner"
          if grep -Fq 'pg_restore' "$runner" ||
             grep -Fq 'accepted-prefix.dump' "$runner"; then
            echo "STOP: W512 seed runner refers to the W128 dump/restore chain" >&2
            exit 1
          fi
          echo "FI W512 SEED HOST SCRIPT STATIC GATE PASS fresh_w512_chain=true signed_run=not_executed"

      - name: W512 offline seed-copy pilot shell and exact two-worker isolation gates
        shell: bash
        run: |
          set -euo pipefail
          pilot=go/cmd/fi-backlog-recover/run_private_h16_parallel_a_w512_pilot2_host.sh
          sh -n "$pilot"
          test "$(grep -cx "JAIL" "$pilot")" = 1
          grep -Fq 'seed=/home/jwood/fi-window-bench-w512-20261113T205026Z' "$pilot"
          grep -Fq '0|493478|' "$pilot"
          grep -Fq 'cp -R "$seed/$name/data" "$root/$name/data"' "$pilot"
          grep -Fq -- '-private-w512-2g -private-hash-h16' "$pilot"
          grep -Fq -- '-window-profile=W512' "$pilot"
          grep -Fq -- '-processing-chunk-records=32768' "$pilot"
          grep -Fq -- '-test-stop-after-windows=2' "$pilot"
          grep -Fq -- '-start-window=1' "$pilot"
          grep -Fq -- '-verified-cache-root="$cache"' "$pilot"
          grep -Fq 'FI W512 SIGNED READBACK PASS' "$pilot"
          grep -Fq 'FI W512 TWO-WINDOW PILOT ACCEPTED' "$pilot"
          grep -Fq "source_window=W512 atomic=true" "$pilot"
          if grep -Fq 'pg_restore' "$pilot" ||
             grep -Fq 'accepted-prefix.dump' "$pilot" ||
             grep -Fq -- '-stream-loader' "$pilot" ||
             grep -Fq -- '-private-w512-verified-cache-seed' "$pilot"; then
            echo "STOP: W512 pilot must only replay already admitted cached source" >&2
            exit 1
          fi
          echo "FI W512 TWO-WINDOW PILOT STATIC GATE PASS seed=offline_copy first_new_window=1 workers=2 signed_replay=not_run"

      - name: W512 WAL 1GB versus 8GB four-credit A/B static invariants
        shell: bash
        run: |
          set -euo pipefail
          base=go/cmd/fi-backlog-recover
          one="$base/run_private_h16_parallel_a_w512_wal_w1g_host.sh"
          eight="$base/run_private_h16_parallel_a_w512_wal_w8g_host.sh"
          both="$base/run_private_h16_parallel_a_w512_wal_ab_host.sh"
          sh -n "$one"
          sh -n "$eight"
          sh -n "$both"
          test "$(grep -cx "JAIL" "$one")" = 1
          test "$(grep -cx "JAIL" "$eight")" = 1
          grep -Fq 'sh "$script" h16' "$both"
          grep -Fq 'FI_WAL_AB_STAMP="$stamp" sh "$script" h16' "$both"
          grep -Fq "sha1=9e150d4e1186d25775ed9b232c17bb8b29de5b77" "$both"
          grep -Fq "sha8=604c201e3f14ecd779bff0bf5152a1c278afe8ee" "$both"
          grep -Fq 'signed_descriptors_identical=true' "$both"
          for script in "$one" "$eight"; do
            grep -Fq "track_io_timing=on -c track_wal_io_timing=on" "$script"
            grep -Fq -- '-window-profile=W512' "$script"
            grep -Fq -- '-test-stop-after-windows=2' "$script"
            grep -Fq 'f["inflight_limit"]!=4' "$script"
            grep -Fq 'f["reorder_peak"]+0>3' "$script"
            grep -Fq "signed byte-identical readback" "$script"
            grep -Fq 'W512_CHECKPOINTS.tsv' "$script"
            grep -Fq 'pg_settings.txt' "$script"
            grep -Fq 'max_wal_size' "$script"
            grep -Fq 'track_wal_io_timing' "$script"
            grep -Fq 'full_page_writes' "$script"
            grep -Fq "coalesce(sum(committed_records),0)" "$script"
            grep -Fq 'AND (SELECT committed_records FROM fi_recovery.typed_window WHERE window_index=1)=499052' "$script"
            grep -Fq 'AND (SELECT committed_records FROM fi_recovery.typed_window WHERE window_index=2)=498382' "$script"
            if grep -Fq 'pg_restore' "$script" || grep -Fq -- '-private-w512-verified-cache-seed' "$script"; then
              echo "STOP: W512 WAL replay changed authenticated-cache provenance" >&2
              exit 1
            fi
          done
          python3 - "$one" "$eight" <<'PY'
          import sys
          a,b=[open(p,encoding="utf-8").read() for p in sys.argv[1:]]
          def normalized(t):
              return t.replace("w1g","WA").replace("w8g","WA").replace("1GB","WAL").replace("8GB","WAL")
          if normalized(a) != normalized(b):
              raise SystemExit("W512 WAL A/B STOP: additional script differences beyond WAL cap, arm identifiers, and evidence labels")
          print("FI W512 WAL A/B SOURCE DIFF GATE PASS sole_variable=max_wal_size fixed_workers=2 fixed_credits=4")
          PY
          echo "FI W512 WAL A/B CI PASS shell=valid SQL_gates=retained signed_source=identical PG_io_timing=enabled signed_replay=not_executed"

      - name: W512 two-worker 4-to-16 credit experiment exact-anchor and FreeBSD source gate
        shell: bash
        run: |
          set -euo pipefail
          runner=go/cmd/fi-backlog-recover/run_private_h16_parallel_a_w512_inflight16_host.sh
          patcher=go/cmd/fi-backlog-recover/patchers/w512_inflight16/main.go
          sh -n "$runner"
          grep -Fq 'existing dev PostgreSQL' "$runner" || grep -Fq 'fi-dev PostgreSQL postmaster already running' "$runner"
          grep -Fq 'source=copy_of_accepted_W512 workers=2 credits=16 sql_writers=1' "$runner"
          grep -Fq 'accepted W512 seed must remain stopped' "$runner"
          grep -Fq 'FI W512 INFLIGHT16 PILOT ACCEPTED' "$runner"
          grep -Fq 'original_seed_unchanged' "$patcher" || grep -Fq 'original_seed_untouched' "$patcher"
          test "$(grep -cx "JAIL" "$runner")" = 1
          base="/home/jwood/fi-window-bench-w512-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/optimized-source"
          test -d "$base/go/internal/recordingest"
          target="/home/jwood/fi-window-bench-w512-inflight16-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$target"
          mkdir -m 700 "$target"
          cp -R "$base" "$target/optimized-source"
          accepted=a75e18661b070e9c76cd00e18cf35ee8fd6d3d0a
          git show "$accepted:go/cmd/fi-backlog-recover/run_private_h16_parallel_a_w512_pilot2_host.sh" > "$target/pilot-inflight16.sh"
          test "$(git hash-object "$target/pilot-inflight16.sh")" = 86a7543e4379f62209013ddd161bf6532c48f171
          mkdir -p "$target/optimized-source/go/cmd/fi-backlog-recover/patchers/w512_inflight16"
          cp "$patcher" "$target/optimized-source/$patcher"
          (cd "$target/optimized-source/go" &&
            go run ./cmd/fi-backlog-recover/patchers/w512_inflight16/main.go "$target")
          sh -n "$target/pilot-inflight16.sh"
          (cd "$target/optimized-source/go" &&
            gofmt -w ./internal/recordingest/private_parallel_preparation.go               ./internal/recordingest/postgres_ingest.go               ./cmd/fi-backlog-recover/main_freebsd.go)
          (cd "$target/optimized-source/go" &&
            go test -count=1 -timeout=180s ./internal/recordingest -run '^TestPrivateParallelA')
          (cd "$target/optimized-source/go" &&
            go test -race -count=1 -timeout=180s ./internal/recordingest -run '^TestPrivateParallelA')
          (cd "$target/optimized-source/go" &&
            GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build               -o "$target/fi-optfield-recover-16" ./cmd/fi-backlog-recover)
          test -s "$target/fi-optfield-recover-16"
          grep -Fq 'privateParallelAMaxInFlight = 16'             "$target/optimized-source/go/internal/recordingest/private_parallel_preparation.go"
          grep -Fq 'inflight_limit=16 writers=1'             "$target/optimized-source/go/internal/recordingest/postgres_ingest.go"
          grep -Fq 'workers=2 inflight=16 postgres_writers=1 source_window=%s atomic=true'             "$target/optimized-source/go/cmd/fi-backlog-recover/main_freebsd.go"
          grep -Fq 'FI W512 INFLIGHT16 PILOT ACCEPTED' "$target/pilot-inflight16.sh"
          grep -Fq -- '-window-profile=W512' "$target/pilot-inflight16.sh"
          grep -Fq -- '-test-stop-after-windows=2' "$target/pilot-inflight16.sh"
          echo "FI W512 INFLIGHT16 CI PASS source=isolated W512=unchanged workers=2 in_flight=16 writer=1 FreeBSD=build only signed_replay=not_executed"

      - name: W512 four-arm worker concurrency sweep source, ordering and FreeBSD build
        shell: bash
        run: |
          set -euo pipefail
          runner=go/cmd/fi-backlog-recover/run_private_h16_parallel_a_w512_worker_sweep_host.sh
          patcher=go/cmd/fi-backlog-recover/patchers/w512_worker_sweep/main.go
          sh -n "$runner"
          # Regression: the real FreeBSD host has no git executable.
          # Git is required inside fi-dev only, where the pinned source resides.
          grep -Fq 'for command in jls jexec sha256 awk grep sed cmp ps; do' "$runner"
          grep -Fq 'command -v git >/dev/null 2>&1' "$runner"
          if grep -Fq 'for command in jls jexec git ' "$runner"; then
            echo "STOP: worker sweep incorrectly requires Git on FreeBSD host" >&2
            exit 1
          fi
          grep -Fq 'workers=2,4,8,16 credits=32' "$runner"
          grep -Fq 'for workers in 2 4 8 16' "$runner"
          grep -Fq 'W512_CHECKPOINTS.tsv' "$runner"
          grep -Fq 'FI W512 SIGNED READBACK PASS batches=431 byte_identical=true manifests_identical=true' "$runner"
          grep -Fq 'postgres_writers=1' "$runner"
          grep -Fq 'max_wal_size=8GB' "$runner"
          grep -Fq 'RESULTS.csv' "$runner"
          test "$(grep -cx "JAIL" "$runner")" = 1
          source="/home/jwood/fi-window-bench-w512-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/optimized-source"
          test -f "$source/go/internal/recordingest/private_parallel_preparation.go"
          for n in 2 4 8 16; do
            stage="/home/jwood/fi-window-bench-w512-worker${n}-${GITHUB_RUN_ID}T${GITHUB_RUN_ATTEMPT}Z"
            test ! -e "$stage"
            mkdir -m 700 "$stage"
            cp -R "$source" "$stage/optimized-source"
            git show "b4364e0de3c1267545748ca739895a737c871a2c:go/cmd/fi-backlog-recover/run_private_h16_parallel_a_w512_wal_w8g_host.sh" \
              > "$stage/pilot-worker$n.sh"
            test "$(git hash-object "$stage/pilot-worker$n.sh")" = 604c201e3f14ecd779bff0bf5152a1c278afe8ee
            mkdir -p "$stage/optimized-source/go/cmd/fi-backlog-recover/patchers/w512_worker_sweep"
            cp "$patcher" "$stage/optimized-source/$patcher"
            (cd "$stage/optimized-source/go" &&
              go run ./cmd/fi-backlog-recover/patchers/w512_worker_sweep/main.go "$stage" "$n")
            sh -n "$stage/pilot-worker$n.sh"
            (cd "$stage/optimized-source/go" &&
              gofmt -w ./internal/recordingest/private_parallel_preparation.go \
                ./internal/recordingest/postgres_ingest.go \
                ./cmd/fi-backlog-recover/main_freebsd.go)
            (cd "$stage/optimized-source/go" &&
              go test -count=1 -timeout=180s ./internal/recordingest -run '^TestPrivateParallelA')
            if [ "$n" = 16 ]; then
              (cd "$stage/optimized-source/go" &&
                go test -race -count=1 -timeout=180s ./internal/recordingest -run '^TestPrivateParallelA')
            fi
            (cd "$stage/optimized-source/go" &&
              GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build \
                -o "$stage/fi-optfield-recover-w$n" ./cmd/fi-backlog-recover)
            test -s "$stage/fi-optfield-recover-w$n"
            grep -Eq "privateParallelAPreparers[[:space:]]+=[[:space:]]+$n" "$stage/optimized-source/go/internal/recordingest/private_parallel_preparation.go"
            grep -Fq 'privateParallelAMaxInFlight = 32' "$stage/optimized-source/go/internal/recordingest/private_parallel_preparation.go"
            grep -Fq "workers=$n inflight=32 postgres_writers=1 source_window=%s atomic=true" "$stage/optimized-source/go/cmd/fi-backlog-recover/main_freebsd.go"
            grep -Fq "workers=$n inflight_limit=32 writers=1" "$stage/optimized-source/go/internal/recordingest/postgres_ingest.go"
            grep -Fq "FI W512 WORKER $n PILOT ACCEPTED" "$stage/pilot-worker$n.sh"
            grep -Fq 'FI W512 SIGNED READBACK PASS' "$stage/pilot-worker$n.sh"
            grep -Fq -- '-start-window=1' "$stage/pilot-worker$n.sh"
            grep -Fq -- '-test-stop-after-windows=2' "$stage/pilot-worker$n.sh"
            grep -Fq 'track_io_timing=on -c track_wal_io_timing=on' "$stage/pilot-worker$n.sh"
            grep -Fq "f[\"workers\"]!=$n||f[\"inflight_limit\"]!=32" "$stage/pilot-worker$n.sh"
            grep -Fq 'f["reorder_peak"]+0>31' "$stage/pilot-worker$n.sh"
            echo "FI W512 WORKER SWEEP STATIC ARM PASS workers=$n credits=32 source_order=maintained sql_writer=1 build=freebsd"
          done
          echo "FI W512 WORKER SWEEP CI PASS workers=2,4,8,16 credits=32 same_signed_windows=true 8GB_WAL=true authoritative=0 signed_replay=not_executed"
