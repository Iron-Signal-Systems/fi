          assert 'FI C1 B FINAL GENERATION VERIFY PASS ' in process
          assert 'C1_B_GROUPS.txt' in runner and 'C1_B_FINAL.txt' in runner
          assert 'final_generation_proof=B' in runner
          assert 'TestPrivateC1FullFourGiBGroupsCoverEntireSignedGeneration' in test
          sql=(root/'testdata/c1/private_c1_five_sql.go').read_text()
          race=(root/'testdata/c1/private_c1_backpressure_test.go').read_text()
          assert 'if f==privateP6USN' in sql
          assert 'return 1' in sql
          assert 'len(lane.outstanding)>=w.familyHandoffLimit(f)' in sql
          assert 'TestPrivateC1USNRequiresPreviousCommittedSQLACK' in race
