name: FI FreeBSD Target Build (CI build host)

on:
  push:
    paths:
      - 'go/internal/recordingest/**'
      - 'go/cmd/fi-backlog-recover/**'
      - 'go/cmd/fi-backlog-pg-relay/**'
      - 'go/cmd/fi-crl-publish/**'
      - 'go/cmd/fi-backlog-publish/**'
      - 'go/internal/crlpublish/**'
      - 'go/go.mod'
      - '.github/workflows/fi-freebsd-cross-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: go/go.sum
      - name: P10 native P6 runner POSIX syntax and Go parser
        run: |
          set -eu
          sh -n ./cmd/fi-backlog-recover/run_private_p10_native_p6_controller.sh
          sh -n ./cmd/fi-backlog-recover/run_private_p10_native_p6_c220_host.sh
          # Exact source-asset staging order: the original P6 patcher
          # validates every staged file before modifying the clone tree.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("cmd/fi-backlog-recover/run_private_p10_native_p6_c220_host.sh")
          src = p.read_text()
          stage = 'testdata/family-p10/private_p6_family_buffers.go"'
          patcher = './cmd/fi-backlog-recover/patchers/family_p3_c220 "$src"'
          check = '[ -s "$src/go/internal/recordingest/private_p6_family_buffers.go" ]'
          assert src.count(stage) == 1, "P10 P6 family buffer must be staged exactly once"
          assert src.count(patcher) == 1, "P6 original patcher must run exactly once"
          assert src.index(stage) < src.index(check) < src.index(patcher), (
              "P10 P6 family buffer must be fully staged before original P6 patcher"
          )
          assert src.splitlines().count("JAIL") == 1, "one private C220 JAIL heredoc"
          assert sum(line.startswith("sql(){") for line in src.splitlines()) == 1, "one SQL helper"
          assert sum(line.startswith("stats(){") for line in src.splitlines()) == 1, "one PG stats helper"
          print("FI P10 P6 PATCHER INPUT ORDER PASS")
          worker = Path("cmd/fi-backlog-recover/testdata/family-p10/private_p10_five_sql.go").read_text()
          for required in [
              "newACECopyState()", "newContentHashCopyState()",
              "newUSNChangeCopyState()", "newNTFSObjectCache()",
              "newNTFSScopeIdentityCache()",
              "privateP10BoundedProjectorContext(ctx)",
              "aceCopy.flushAll(writeCtx,projector)",
              "hashCopy.flush(writeCtx,projector)",
              "usnCopy.flushAll(writeCtx,projector)",
              "projector:=privateProjectionTx{Tx:tx}",
          ]:
              assert required in worker, f"P10 P6 bounded SQL worker missing {required}"
          assert worker.index("aceCopy.flushAll(writeCtx,projector)") < worker.index("return tx.Commit(ctx)"), (
              "P10 cannot commit with unflushed DACL/SACL children"
          )
          for forbidden in [
              "GRANT pg_read_all_settings",
              "GRANT SELECT, INSERT ON fi_recovery_projection.windows_security_event_field_p10_default",
              "REVOKE ALL ON fi_recovery_projection.windows_security_event_field_p10_default",
          ]:
              assert forbidden not in src, f"P10 must not change clone role/ACL permissions: {forbidden}"
          assert "current_setting('data_directory')" not in worker, (
              "P10 must not demand new fi_ingest role grants for PGDATA introspection"
          )
          assert 'psql "$clone_ingest_dsn" -X -qAt -v ON_ERROR_STOP=1 -c "SELECT current_setting(' not in src, (
              "P10 fi_ingest must not query restricted PGDATA"
          )
          assert 'psql "$clone_owner_dsn" -X -qAt -v ON_ERROR_STOP=1 -c "SELECT current_setting(' in src, (
              "P10 must still verify exact PGDATA through existing clone owner"
          )
          assert 'fi_ingest|false' in src, "P10 must keep original ingest role and no standby"
          assert 'has_table_privilege(' not in src, (
              "P10 must not add an unnecessary privilege probe that stopped the prior clone"
          )
          assert 'FI P10 ORIGINAL INGEST ROLE PASS permissions=unchanged' in src, (
              "P10 must preserve and confirm existing P6 fi_ingest role without grants"
          )
          print("FI P10 P6 BOUNDED ACE/HASH/USN COPY AND ORIGINAL PRIVILEGES PASS")
          PY
          for source in ./cmd/fi-backlog-recover/testdata/family-p10/*.go; do
            gofmt -e "$source" > /dev/null
          done
          echo 'FI P10 NATIVE P6 RUNNER/SOURCE SYNTAX PASS'
      - name: P11 P5-P6 native family source, design and runnable Go tests
        run: |
          set -euo pipefail
          sh -n ./cmd/fi-backlog-recover/run_private_p11_p5_p6_native_controller.sh
          sh -n ./cmd/fi-backlog-recover/run_private_p11_p5_p6_native_c220_host.sh
          for source in ./cmd/fi-backlog-recover/testdata/family-p11/*.go; do
            gofmt -e "$source" >/dev/null
          done
          python3 - <<'PY'
          from pathlib import Path
          path = Path("cmd/fi-backlog-recover/testdata/family-p11")
          direct = (path / "private_p11_direct.go").read_text()
          sql = (path / "private_p11_five_sql.go").read_text()
          modules = (path / "private_p11_modules.go").read_text()
          runner = Path("cmd/fi-backlog-recover/run_private_p11_p5_p6_native_c220_host.sh").read_text()
          controller = Path("cmd/fi-backlog-recover/run_private_p11_p5_p6_native_controller.sh").read_text()
          assert direct.index("newPrivateP5Pool(ctx,startWindow)") < direct.index("for wi:=startWindow;wi<end;wi++")
          assert direct.index("newPrivateP6Buffers(startWindow,sink)") < direct.index("for wi:=startWindow;wi<end;wi++")
          assert "pool.newStream(ctx,reader,prepare)" in direct
          assert "io.TeeReader(f,hasher)" in direct
          assert "privateHeaderFirstPrepare" in direct
          assert "tryPrepareSinglePassSecurity(raw)" not in direct
          assert "buffers.Add(ctx,privateP6Record{" in direct
          assert "privateP11SQLModules[i]" in sql
          assert "coordinator.Family(" not in sql
          assert all(s in modules for s in (
              "(*privateP6SQLCoordinator).security",
              "(*privateP6SQLCoordinator).ntfs",
              "(*privateP6SQLCoordinator).coverage",
              "(*privateP6SQLCoordinator).usn",
              "(*privateP6SQLCoordinator).other",
          ))
          assert "private_p11_modules.go" in runner
          assert "P11_PREP.txt" in runner
          assert "P11_SQL_PROFILE.txt" in runner
          assert "P11_SECURITY_COPY.txt" in runner
          assert "P11_SECURITY_COPY.txt" in controller
          assert "FI P11 SECURITY COPY PROFILE " in sql
          assert "s.FieldCopy+=counters.FieldCopy" in sql
          assert "s.EventCopy+=counters.EventCopy" in sql
          assert "sourcecommit=83b57529dc4635c88eb7de7ed695f57196716877" in runner
          assert "sourcepin=83b57529dc4635c88eb7de7ed695f57196716877" in controller
          assert "runnerpin=9001e847009406e5223f6a79cb17a3c118a0d23f" in controller
          assert not any(k in runner for k in ("GRANT pg_read_all_settings", "GRANT SELECT, INSERT", "REVOKE ALL"))
          assert "patchers/p7_parallel_bridge" not in runner
          assert runner.splitlines().count("JAIL")==1
          assert "preflight|compile|family" in runner
          assert "mode=$6" in runner
          assert runner.index('if [ "$mode" = compile ]; then') < runner.index('cp -R "$seed/$name/data"')
          assert "FI P11 C220 PRIVATE GO/RACE GATE PASS" in runner
          assert "preflight|compile|p11" in controller
          print("FI P11 P5-P6 ARCHITECTURE AND RUNNER SOURCE PASS")
          PY
          # The accepted C220 optimized-source is NOT the default repository
          # tree; its P5/P6 File validation and H16 performance code differs.
          # Compiling against reconstructed Linux stubs is not acceptance.
          # The exact C220 runner's 'compile' mode runs the real Go/race
          # tests and exits before copying or starting PostgreSQL.
          echo 'FI P11 LINUX SYNTAX/ARCHITECTURE PASS exact-C220-seed-go-race-pending'
      - name: C1 five-family development architecture and source invariants
        run: |
          set -euo pipefail
          sh -n ./cmd/fi-backlog-recover/run_private_c1_five_family_controller.sh
          sh -n ./cmd/fi-backlog-recover/run_private_c1_five_family_c220_host.sh
          for source in ./cmd/fi-backlog-recover/testdata/c1/*.go; do
            gofmt -e "$source" >/dev/null
          done
          python3 - <<'PY'
          from pathlib import Path
          core=Path("cmd/fi-backlog-recover/testdata/c1")
          direct=(core/"private_c1_direct.go").read_text()
          sql=(core/"private_c1_five_sql.go").read_text()
          buffers=(core/"private_c1_family_buffers.go").read_text()
          modules=(core/"private_c1_modules.go").read_text()
          tests=(core/"private_c1_correctness_test.go").read_text()
          runner=Path("cmd/fi-backlog-recover/run_private_c1_five_family_c220_host.sh").read_text()
          controller=Path("cmd/fi-backlog-recover/run_private_c1_five_family_controller.sh").read_text()
          assert "sourcecommit=95c96b6e3f31fa3144375c50acccb2ca0f9f7fe9" in runner
          assert "sourcepin=95c96b6e3f31fa3144375c50acccb2ca0f9f7fe9" in controller
          assert "runnerpin=dd0454bba3c73681f95724775a96e05ed55bf1c9" in controller
          assert direct.index("privateC1RequireCleanDestination(") < direct.index("newPrivateC1FiveSQL(")
          assert direct.index("newPrivateP5Pool(ctx,startWindow)") < direct.index("for wi:=startWindow;wi<end;wi++")
          assert direct.index("newPrivateP6Buffers(startWindow,sink)") < direct.index("for wi:=startWindow;wi<end;wi++")
          assert "pool.newStream(ctx,reader,prepare)" in direct
          assert "io.TeeReader(f,hasher)" in direct
          assert "buffers.Add(ctx,privateP6Record{" in direct
          assert "privateC1SQLModules[i]" in sql
          assert "jobs:make(chan privateC1SQLJob,max*2)" in sql
          assert "go w.runWorker(conn,pid)" in sql
          assert "if err:=w.growWorkers(ctx)" in sql
          assert "activeSecuritySQL" in sql
          assert "peakSecuritySQL" in sql
          assert "workers_min=1 workers_max=%d workers_peak=%d" in sql
          assert "FI C1 P6 SHARED SQL PASS" in direct
          assert "sql_workers_max=$sqlmax" in runner
          assert "C1_POOL.txt" in runner and "C1_POOL.txt" in controller
          assert "FI_W512_C1_SQL_WORKERS_MAX" in runner
          assert "fi_ingest_worker_sql_workers_max" in Path("../tools/deployment/freebsd/runtime.d/fi-ingest-worker.rc.conf.template").read_text()
          assert "-sql-workers-max" in Path("../go/cmd/fi-ingest-worker/main_freebsd.go").read_text() or "sql-workers-max" in Path("../go/cmd/fi-ingest-worker/main_freebsd.go").read_text()
          assert "TestPrivateC1SharedSQLQueueAcceptsAnyFamily" in Path("cmd/fi-backlog-recover/testdata/c1/private_c1_backpressure_test.go").read_text()
          assert "TestPrivateC1AdaptiveSQLWorkersMaxValidation" in Path("cmd/fi-backlog-recover/testdata/c1/private_c1_backpressure_test.go").read_text()
          assert "conn *pgx.Conn" not in sql.split("type privateC1SQLLane struct {",1)[1].split("}",1)[0]
          assert "jobs chan privateC1SQLJob" not in sql.split("type privateC1SQLLane struct {",1)[1].split("}",1)[0]
          assert "privateC1MaxFamilyHandoffsInFlight = 4" in sql
          assert "err:=w.waitNextFamily(ctx,f)" in sql
          assert "lane.backpressureWaits++" in sql
          assert "FI C1 P6 CONTINUOUS FAMILY" in sql
          assert "sourceJobs:make(chan privateC1SourceJob,2)" in sql
          assert "privateC1AwaitSource(w.ctx,job.source)" in sql
          assert "sourceParentWaitWall" in sql
          assert "parent_wait=%s" in sql
          assert "w.WaitSource(ctx)" in sql
          assert "privateC1KnownSourceIDs(ctx)" in Path("cmd/fi-backlog-recover/patchers/family_p3_c220/main.go").read_text()
          assert "privateC1KnownSourceIDsKey" in modules
          assert "private_c1_backpressure_test.go" in runner
          assert "C1_CONTINUOUS_FAMILIES.txt" in runner
          assert "C1_CONTINUOUS_FAMILIES.txt" in controller
          assert "privateC1PostCommitFailpoint(lane.family)" in sql
          assert "privateC1CleanDestinationStatus" in direct
          assert "fi_recovery_projection.source_record" in direct
          assert 'window-complete' not in buffers
          assert 'end-of-input' in buffers
          assert "privateP6USN" in buffers and "WaitFamily(ctx,privateP6File)" in buffers
          assert "WaitAll(ctx)" in buffers
          assert "privateC1MarkTyped" in direct
          assert "privateC1CleanDestinationStatus" in tests
          assert "TestPrivateC1RefusesDirtyPartialOrAlreadyCompletedDestination" in tests
          assert "TestPrivateC1PostCommitInjectionNeverSelectableOutsideDevelopment" in tests
          assert "FI C1 SHARED SQL POOL" in sql
          backpressure=(core/"private_c1_backpressure_test.go").read_text()
          assert "TestPrivateC1P5P6OnlyOldestHandoffWaitsAtBound" in backpressure
          assert "TestPrivateC1P5P6OldestHandoffErrorStopsAdmission" in backpressure
          assert "TestPrivateC1P6DependencyAndFinalFullFenceStillWaitsAll" in backpressure
          assert "TestPrivateC1OrderedSourceBroadcastAndFailure" in backpressure
          assert "TestPrivateC1OrderedSourceOldestOnlyAdmission" in backpressure
          assert "TestPrivateC1KnownSecurityIDsOnlyWhenEnabled" in backpressure
          assert all(s in modules for s in (
             "(*privateP6SQLCoordinator).security",
             "(*privateP6SQLCoordinator).ntfs",
             "(*privateP6SQLCoordinator).coverage",
             "(*privateP6SQLCoordinator).usn",
             "(*privateP6SQLCoordinator).other",
          ))
          assert "testdata/c1/private_c1_family_buffers.go" in runner
          assert "testdata/c1/private_c1_direct.go" in runner
          assert "TestPrivateC1" in runner
          assert "FI C1 CLEAN START PASS" in runner
          assert not any(k in runner for k in ("GRANT pg_read_all_settings","REVOKE ALL","patchers/p7_parallel_bridge"))
          assert "preflight|compile|c1|inject-file" in controller
          assert "preflight|compile|family|inject-file" in runner
          assert "FI C1 DEVELOPMENT FAILURE CONTAINMENT PASS" in runner
          assert "FI C1 DEVELOPMENT FAILURE/RESTART GUARD PASS" in controller
          assert 'typed_window WHERE window_index >= 1' in runner
          assert 'FI_C1_DEV_FAIL_AFTER_FILE_SQL_COMMIT=1' in runner
          assert runner.index('if [ "$mode" = compile ]; then') < runner.index('cp -R "$seed/$name/data"')
          print("FI C1 P5 + P6 DEVELOPMENT ARCHITECTURE AND SAFETY SOURCE PASS")
          PY
          echo 'FI C1 Go syntax/architecture PASS; exact C220 compiled Go/race and full SQL test remain required'
      - name: C1 backend SQL worker configuration and FreeBSD cross-build
        run: |
          set -euo pipefail
          gofmt -e ./cmd/fi-ingest-worker/main_freebsd.go >/dev/null
          gofmt -e ./internal/freebsd/backendinstall/runtime_assets_generated.go >/dev/null
          gofmt -e ./internal/freebsd/backendinstall/runtime_sql_workers_test.go >/dev/null
          GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/fi-ingest-worker-c1-freebsd ./cmd/fi-ingest-worker
          GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go test -c -o /tmp/fi-backendinstall-c1-freebsd.test ./internal/freebsd/backendinstall
          go test -count=1 ./internal/freebsd/backendinstall -run 'TestManagedIngestAdaptiveSQLWorkersBound|TestRuntimeStaticAssetsRemainExact'
          echo 'FI C1 BACKEND SQL WORKER CONFIG AND RUNTIME COMPILE PASS'
      - name: C1 eight-GiB signed grouping test and controller source contract
        run: |
          set -euo pipefail
          sh -n ./cmd/fi-backlog-recover/run_private_c1_eight_gib_controller.sh
          sh -n ./cmd/fi-backlog-recover/run_private_c1_eight_gib_c220_host.sh
          gofmt -e ./cmd/fi-backlog-recover/testdata/c1/private_c1_eight_gib_group.go >/dev/null
          gofmt -e ./cmd/fi-backlog-recover/testdata/c1/private_c1_eight_gib_group_test.go >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          root=Path('cmd/fi-backlog-recover')
          runner=(root/'run_private_c1_eight_gib_c220_host.sh').read_text()
          controller=(root/'run_private_c1_eight_gib_controller.sh').read_text()
          code=(root/'testdata/c1/private_c1_eight_gib_group.go').read_text()
          test=(root/'testdata/c1/private_c1_eight_gib_group_test.go').read_text()
          source=(root/'testdata/c1/private_c1_direct.go').read_text()
          assert 'sourcepin=1ca8d7b8992f50ad5b70ec41e416237b1b6513f3' in controller
          assert 'runnerpin=be36d70b0a7a1491f38ad8b383ae26f50a0f5c88' in controller
          assert 'sourcecommit=1ca8d7b8992f50ad5b70ec41e416237b1b6513f3' in runner
