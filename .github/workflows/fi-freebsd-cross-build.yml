          assert 'privateC1VerifyCompleteGroupedReplay(ctx,reader,g,ds)' not in source
          assert 'privateC1VerifyCompleteGroupedReplay(ctx,conn,g,p.Descriptors)' in process
          assert 'privateC1VerifyEightGiBPrefix(ctx,conn,g,p.Descriptors,p.End)' in process
