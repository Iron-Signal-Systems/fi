name: FI FreeBSD Cross Build

on:
  push:
    paths:
      - 'go/internal/recordingest/**'
      - 'go/cmd/fi-backlog-recover/**'
      - 'go/cmd/fi-backlog-pg-relay/**'
      - 'go/cmd/fi-crl-publish/**'
      - 'go/cmd/fi-backlog-publish/**'
      - 'go/internal/crlpublish/**'
      - 'go/go.mod'
      - '.github/workflows/fi-freebsd-cross-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: go/go.sum
      - name: Signed root CRL renewal validation tests
        run: go test -count=1 -v ./internal/crlpublish
      - name: PostgreSQL relay wire-protocol unit tests
        run: go test -count=1 -v ./cmd/fi-backlog-pg-relay
      - name: Previously authenticated signed-cache replay and tamper rejection
        run: go test -count=1 -v ./internal/recordingest -run 'TestIndexedPrivate(VerifiedCacheNoCurrentCRLButExactOriginalHashes|WindowLimitsAllowed)'
      - name: W128 to K32 independent family routing and durability
        run: go test -count=1 -v ./internal/recordingest -run 'TestPrivateContinuous(K32|FamiliesDoNotFlush|SecurityCapacityFlush|SQLFailure|FlushesAtExactCapacity)'
      - name: Original H16 combined Security/coverage buffering without SQL redesign
        run: |
          go test -count=1 -v ./internal/recordingest -run '^TestH16Combined'
          go build -o /tmp/fi-h16-combined-patcher ./cmd/fi-backlog-recover/patchers/h16_combined_buffer
      - name: FreeBSD recovery executable and typed-test cross compilation
        env:
          GOOS: freebsd
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          sh -n ./cmd/fi-backlog-recover/run_fixed_w128_chunk_benchmarks.sh
          sh -n ./cmd/fi-backlog-recover/run_cached_wal_benchmarks.sh
          sh -n ./cmd/fi-backlog-recover/run_private_continuous_family_w34_host.sh
          sh -n ./cmd/fi-backlog-recover/run_private_h16_combined_buffers_w34_host.sh
          sh -n ./cmd/fi-backlog-recover/provision_four_benchmark_clusters.sh
          go build -o /tmp/fi-backlog-recover-freebsd ./cmd/fi-backlog-recover
          go build -o /tmp/fi-backlog-pg-relay-freebsd ./cmd/fi-backlog-pg-relay
          go build -o /tmp/fi-crl-publish-freebsd ./cmd/fi-crl-publish
          go build -o /tmp/fi-backlog-publish-freebsd ./cmd/fi-backlog-publish
          go test -c -o /tmp/fi-recordingest-freebsd.test ./internal/recordingest
          go test -c -tags fi_backlog_typed_window_integration -o /tmp/fi-recordingest-freebsd-integrated.test ./internal/recordingest
