name: FI FreeBSD Target Build (CI build host)

on:
  push:
    paths:
      - 'go/internal/recordingest/**'
      - 'go/cmd/fi-backlog-recover/**'
      - 'go/cmd/fi-backlog-pg-relay/**'
      - 'go/cmd/fi-crl-publish/**'
      - 'go/cmd/fi-backlog-publish/**'
      - 'go/internal/crlpublish/**'
      - 'go/go.mod'
      - '.github/workflows/fi-freebsd-cross-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: go/go.sum
      - name: P10 native P6 runner POSIX syntax and Go parser
        run: |
          set -eu
          sh -n ./cmd/fi-backlog-recover/run_private_p10_native_p6_controller.sh
          sh -n ./cmd/fi-backlog-recover/run_private_p10_native_p6_c220_host.sh
          # Exact source-asset staging order: the original P6 patcher
          # validates every staged file before modifying the clone tree.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("cmd/fi-backlog-recover/run_private_p10_native_p6_c220_host.sh")
          src = p.read_text()
          stage = 'testdata/family-p10/private_p6_family_buffers.go"'
          patcher = './cmd/fi-backlog-recover/patchers/family_p3_c220 "$src"'
          check = '[ -s "$src/go/internal/recordingest/private_p6_family_buffers.go" ]'
          assert src.count(stage) == 1, "P10 P6 family buffer must be staged exactly once"
          assert src.count(patcher) == 1, "P6 original patcher must run exactly once"
          assert src.index(stage) < src.index(check) < src.index(patcher), (
              "P10 P6 family buffer must be fully staged before original P6 patcher"
          )
          assert src.count("\\nJAIL\\n") == 1, "one private C220 JAIL heredoc"
          assert src.count("\\nsql(){") == 1, "one SQL helper"
          assert src.count("\\nstats(){") == 1, "one PG stats helper"
          print("FI P10 P6 PATCHER INPUT ORDER PASS")
          PY
          for source in ./cmd/fi-backlog-recover/testdata/family-p10/*.go; do
            gofmt -e "$source" > /dev/null
          done
          echo 'FI P10 NATIVE P6 RUNNER/SOURCE SYNTAX PASS'
      - name: Signed root CRL renewal validation tests
        run: go test -count=1 -v ./internal/crlpublish
      - name: PostgreSQL relay wire-protocol unit tests
        run: go test -count=1 -v ./cmd/fi-backlog-pg-relay
      - name: Previously authenticated signed-cache replay and tamper rejection
        run: go test -count=1 -v ./internal/recordingest -run 'TestIndexedPrivate(VerifiedCacheNoCurrentCRLButExactOriginalHashes|WindowLimitsAllowed)'
      - name: W128 to K32 independent family routing and durability
        run: go test -count=1 -v ./internal/recordingest -run 'TestPrivateContinuous(K32|FamiliesDoNotFlush|SecurityCapacityFlush|SQLFailure|FlushesAtExactCapacity)'
      - name: Original H16 combined Security/coverage buffering without SQL redesign
        run: |
          go test -count=1 -v ./internal/recordingest -run '^TestH16Combined'
          go build -o /tmp/fi-h16-combined-patcher ./cmd/fi-backlog-recover/patchers/h16_combined_buffer
      - name: Header-first W512 clone-only source and FreeBSD runner syntax
        run: |
          set +e
          sh -n ./cmd/fi-backlog-recover/run_private_h16_parallel_a_w512_c220_p2_host.sh
          baseline_status=$?
          sh -n ./cmd/fi-backlog-recover/run_private_header_first_w512_c220_p2_host.sh
          header_status=$?
          bash -n ./cmd/fi-backlog-recover/run_private_header_first_w512_c220_p2_host.sh
          bash_status=$?
          printf 'FI SHELL SYNTAX baseline_posix=%s header_posix=%s header_bash=%s\n' "$baseline_status" "$header_status" "$bash_status"
          [ "$header_status" = 0 ] || exit "$header_status"
          set -e
          for source in \
            ./internal/recordingest/private_canonical_spool_dispatch.go \
            ./cmd/fi-backlog-recover/testdata/header-first/private_header_first_p2.go \
            ./cmd/fi-backlog-recover/testdata/header-first/private_header_first_p2_test.go; do
            echo "FI GO SYNTAX $source"
            if ! gofmt -e "$source" >/tmp/fi-header-first-gofmt.log 2>&1; then
              echo "FI GO SYNTAX FAIL $source"
              cat /tmp/fi-header-first-gofmt.log
              exit 1
            fi
          done
          go test -count=1 ./internal/recordingest -run '^TestCanonicalDispatch'
          go build -o /tmp/fi-header-first-w512-patcher ./cmd/fi-backlog-recover/patchers/header_first_c220
      - name: Header-first P2 isolated Go compile and stream acceptance
        run: |
          scratch=$(mktemp -d /tmp/fi-header-p2-ci-XXXXXXXX)
          trap 'rm -rf "$scratch"' EXIT
          cp -R . "$scratch/go"
          pkg="$scratch/go/internal/recordingest"
          cp ./cmd/fi-backlog-recover/testdata/h16-parallel-a/private_parallel_preparation.go "$pkg/private_parallel_preparation.go"
          cp ./cmd/fi-backlog-recover/testdata/header-first/private_header_first_p2.go "$pkg/private_header_first_p2.go"
          cp ./cmd/fi-backlog-recover/testdata/header-first/private_header_first_p2_test.go "$pkg/private_header_first_p2_test.go"
          python3 - "$pkg/private_parallel_preparation.go" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          src = p.read_text()
          anchor = "type privateParallelLine struct {\n    ordinal int64"
          replacement = "type privateParallelLine struct {\n    headerKind string\n    headerFamily spoolDispatchFamily\n    ordinal int64"
          if src.count(anchor) != 1:
              raise SystemExit("FI HEADER FIRST CI STOP: privateParallelLine anchor mismatch")
          p.write_text(src.replace(anchor, replacement, 1))
          PY
          cat > "$pkg/private_h16_ci_stub.go" <<'STUB'
          package recordingest
          import "context"
          // CI-only stub. C220 uses the exact real H16 patch, not this file.
          func privateH16CombinedFileProfileValid(context.Context) bool { return true }
          STUB
          (cd "$scratch/go" &&
           go test -count=1 ./internal/recordingest -run '^TestPrivateHeaderFirstP2' &&
           GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go test -c -o "$scratch/header-first-freebsd.test" ./internal/recordingest)
          echo 'FI HEADER FIRST P2 ISOLATED GO AND FREEBSD TEST BUILD PASS'
      - name: FreeBSD recovery executable and typed-test cross compilation
        env:
          GOOS: freebsd
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          sh -n ./cmd/fi-backlog-recover/run_fixed_w128_chunk_benchmarks.sh
          sh -n ./cmd/fi-backlog-recover/run_cached_wal_benchmarks.sh
          sh -n ./cmd/fi-backlog-recover/run_private_continuous_family_w34_host.sh
          sh -n ./cmd/fi-backlog-recover/run_private_h16_combined_buffers_w34_host.sh
          sh -n ./cmd/fi-backlog-recover/provision_four_benchmark_clusters.sh
          go build -o /tmp/fi-backlog-recover-freebsd ./cmd/fi-backlog-recover
          go build -o /tmp/fi-backlog-pg-relay-freebsd ./cmd/fi-backlog-pg-relay
          go build -o /tmp/fi-crl-publish-freebsd ./cmd/fi-crl-publish
          go build -o /tmp/fi-backlog-publish-freebsd ./cmd/fi-backlog-publish
          go test -c -o /tmp/fi-recordingest-freebsd.test ./internal/recordingest
          go test -c -tags fi_backlog_typed_window_integration -o /tmp/fi-recordingest-freebsd-integrated.test ./internal/recordingest
