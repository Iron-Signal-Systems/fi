name: FI FreeBSD C220 Runtime Build

on:
  push:
    branches: [dev-backend, main]
    paths:
      - 'go/cmd/fi-receiver/**'
      - 'go/cmd/fi-c1-sor-local/**'
      - 'go/cmd/fi-telemetry-backend/**'
      - 'go/internal/transportreceiver/**'
      - 'go/internal/generationrecorder/**'
      - 'go/internal/receivertrust/**'
      - 'go/internal/recordingest/**'
      - 'go/internal/c1handoff/**'
      - 'go/internal/telemetrybackend/**'
      - 'go/go.mod'
      - 'go/go.sum'
      - 'tools/deployment/freebsd/runtime.d/**'
      - '.github/workflows/fi-freebsd-cross-build.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c220-current:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: true
          cache-dependency-path: go/go.sum
      - name: Receiver and custody tests
        run: go test -count=1 ./internal/transportreceiver ./internal/generationrecorder
      - name: Current C1 / independent B tests
        run: |
          go test -count=1 ./internal/c1handoff
          go test -count=1 -tags fi_c1_sor_dev -run '^TestC1' ./internal/recordingest
      - name: Telemetry tests
        run: go test -count=1 ./internal/telemetrybackend
      - name: Build C220 FreeBSD receiver
        run: GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/fi-receiver ./cmd/fi-receiver
      - name: Build current single-jail C1 plus child verifier B
        run: GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -tags fi_c1_sor_dev -o /tmp/fi-c1-sor-live ./cmd/fi-c1-sor-local
      - name: Build current host and fi-sor telemetry
        run: GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/fi-telemetry-backend ./cmd/fi-telemetry-backend
      - name: Verify live C220 service shell syntax
        working-directory: .
        run: |
          set -eu
          for s in \
            tools/deployment/freebsd/runtime.d/fi-c1-sor-live-run.sh \
            tools/deployment/freebsd/runtime.d/fi-c1-sor-live.rc.d \
            tools/deployment/freebsd/runtime.d/fi-receiver-supervisor.sh \
            tools/deployment/freebsd/runtime.d/fi-telemetry-sample.rc.d \
            tools/deployment/freebsd/runtime.d/fi-telemetry-upload.rc.d \
            tools/deployment/freebsd/operations/fi_c1_c220_operational_install.sh
          do sh -n "$s"; done
