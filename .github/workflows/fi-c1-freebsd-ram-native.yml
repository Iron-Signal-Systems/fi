name: FI C1 native FreeBSD 15.1 RAM mount smoke (disposable VM)

on:
  workflow_dispatch:
  push:
    branches:
      - 'dev/c1-two-process-20261120'
    paths:
      - '.github/workflows/fi-c1-freebsd-ram-native.yml'
      - 'go/cmd/fi-backlog-recover/diagnostics/fi_c1_freebsd_ram_smoke.sh'
      - 'go/cmd/fi-backlog-recover/diagnostics/fi_c1_freebsd_two_jail_smoke.sh'
      - 'go/cmd/fi-c1-ram-probe/**'
      - 'go/internal/freebsd/backendinstall/c1_ram_mount_*.go'
      - 'go/internal/freebsd/backendinstall/c1_ram_host_runtime_install*.go'

permissions:
  contents: read

jobs:
  disposable-freebsd-tmpfs-nullfs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout development C1 mount test
        uses: actions/checkout@v4
      - name: Real FreeBSD 15.1 tmpfs/nullfs producer-consumer mount semantics
        uses: vmactions/freebsd-vm@v1
        with:
          release: '15.1'
          arch: x86_64
          mem: 4096
          sync: rsync
          prepare: |
            set -eu
            env ASSUME_ALWAYS_YES=yes pkg install -y go127
          run: |
            set -eu
            uname -sr
            export PATH="/usr/local/go127/bin:$PATH"
            go version
            cd go
            CGO_ENABLED=0 go build -o /var/tmp/fi-c1-ram-probe-native ./cmd/fi-c1-ram-probe
            cd ..
            export FI_C1_RAM_PROBE_BINARY="/var/tmp/fi-c1-ram-probe-native"
            GITHUB_ACTIONS=true sh go/cmd/fi-backlog-recover/diagnostics/fi_c1_freebsd_ram_smoke.sh
            GITHUB_ACTIONS=true sh go/cmd/fi-backlog-recover/diagnostics/fi_c1_freebsd_two_jail_smoke.sh
            export PATH="/usr/local/go127/bin:$PATH"
            go version
            cd go
            go test -tags fi_c1_sor_dev ./internal/c1handoff ./internal/recordingest -run '^TestC1' -count=1
