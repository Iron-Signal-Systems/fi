name: CI

on:
  push:

  pull_request:

jobs:
  linux:
    name: Linux Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: go

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: Test
        run: go test ./...

  windows:
    name: Windows Tests
    runs-on: windows-latest

    defaults:
      run:
        working-directory: go

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: Test
        run: go test ./...
      - name: Verify v2 development installer blocks legacy execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Join-Path $env:RUNNER_TEMP 'fi-install-volume-first-dev.exe'
          go build -o $binary ./cmd/fi-install
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed' }

          # Launch the actual built executable with a strict timeout. A missing
          # guard could otherwise enter interactive legacy installer discovery.
          # Use labeled hashtables, not nested PowerShell arrays: pipeline
          # enumeration could otherwise flatten or omit the empty argument set.
          $blockedCases = @(
            @{ Name = 'default'; Args = [string[]]@() }
            @{ Name = 'apply'; Args = [string[]]@('-apply') }
            @{ Name = 'apply-false'; Args = [string[]]@('-apply=false') }
            @{ Name = 'legacy-plan'; Args = [string[]]@('-plan-only') }
            @{ Name = 'legacy-config'; Args = [string[]]@('-config=C:\FI\legacy.conf') }
            @{ Name = 'lone-v2-scope'; Args = [string[]]@('-volume-config=C:\FI\scope.conf') }
            @{ Name = 'mixed-inventory-apply'; Args = [string[]]@('-list-volumes', '-apply=false') }
            @{ Name = 'mixed-clean-apply'; Args = [string[]]@('-check-clean-install', '-apply=false') }
          )
          foreach ($case in $blockedCases) {
            $argv = $case.Args
            $processInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $processInfo.FileName = $binary
            $processInfo.UseShellExecute = $false
            $processInfo.RedirectStandardOutput = $true
            $processInfo.RedirectStandardError = $true
            foreach ($argument in $argv) {
              [void]$processInfo.ArgumentList.Add($argument)
            }
            $process = [System.Diagnostics.Process]::Start($processInfo)
            if (-not $process.WaitForExit(10000)) {
              $process.Kill($true)
              $process.Dispose()
              throw "Legacy FI installer path did not fail closed: $($argv -join ' ')"
            }
            $standardOutput = $process.StandardOutput.ReadToEnd()
            $standardError = $process.StandardError.ReadToEnd()
            $exitCode = $process.ExitCode
            $process.Dispose()
            if ($exitCode -ne 2 -or
                $standardOutput.Length -ne 0 -or
                $standardError -notmatch 'FI VOLUME-FIRST INSTALLATION BLOCKED') {
              throw "Unexpected installer result for '$($case.Name)': exit=$exitCode stdout=$standardOutput stderr=$standardError"
            }
            Write-Host "PASS: blocked $($case.Name) before legacy installer execution"
          }