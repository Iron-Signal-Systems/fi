# Windows collector CI only. Backend C1/receiver/SoR changes belong to
# FreeBSD-specific workflows, not to Windows tests.
name: FI Windows Collector CI

on:
  push:
    paths:
      - 'go/cmd/fi/**'
      - 'go/cmd/fi-sender/**'
      - 'go/cmd/fi-source/**'
      - 'go/cmd/fi-usn/**'
      - 'go/cmd/usnprobe/**'
      - 'go/cmd/collectorboundaryprobe/**'
      - 'go/cmd/fi-spool-workdir-check/**'
      - 'go/internal/windows/**'
      - 'go/internal/transportsender/**'
      - 'go/internal/transportrecovery/**'
      - 'go/internal/config/**'
      - 'go/internal/records/**'
      - 'go/internal/spool/**'
      - 'go/internal/usncapture/**'
      - 'examples/windows/**'
      - 'examples/gmsa_provisioning/**'
      - 'go/cmd/fi-install/**'
      - 'go/cmd/fi-crl-refresh/**'
      - 'go/cmd/fi-release-lab/**'
      - 'go/internal/transportcrl/**'
      - 'go/internal/transportpackage/**'
      - 'go/internal/transporttrust/**'
      - 'go/internal/transportwire/**'
      - 'go/internal/releaselab/**'
      - 'go/internal/releasecms/**'
      - 'go/internal/spool/**'
      - 'go/internal/usncapture/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'go/cmd/fi/**'
      - 'go/cmd/fi-sender/**'
      - 'go/cmd/fi-source/**'
      - 'go/cmd/fi-usn/**'
      - 'go/cmd/usnprobe/**'
      - 'go/cmd/collectorboundaryprobe/**'
      - 'go/cmd/fi-spool-workdir-check/**'
      - 'go/internal/windows/**'
      - 'go/internal/transportsender/**'
      - 'go/internal/transportrecovery/**'
      - 'go/internal/config/**'
      - 'go/internal/records/**'
      - 'go/internal/spool/**'
      - 'go/internal/usncapture/**'
      - 'examples/windows/**'
      - 'examples/gmsa_provisioning/**'
      - 'go/cmd/fi-install/**'
      - 'go/cmd/fi-crl-refresh/**'
      - 'go/cmd/fi-release-lab/**'
      - 'go/internal/transportcrl/**'
      - 'go/internal/transportpackage/**'
      - 'go/internal/transporttrust/**'
      - 'go/internal/transportwire/**'
      - 'go/internal/releaselab/**'
      - 'go/internal/releasecms/**'
      - 'go/internal/spool/**'
      - 'go/internal/usncapture/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  windows:
    name: Windows Collector Tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: go
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - name: Compile restored Windows executables
        run: go build ./cmd/fi ./cmd/fi-sender ./cmd/fi-install ./cmd/fi-crl-refresh ./cmd/fi-usn ./cmd/usnprobe
      - name: Test actual Windows collector and sender packages
        run: >-
          go test -count=1
          ./cmd/fi ./cmd/fi-sender ./cmd/fi-install ./cmd/fi-crl-refresh
          ./internal/windows/... ./internal/usncapture ./internal/transportcrl ./internal/transportpackage
          ./internal/transporttrust ./internal/transportsender
          ./internal/transportwire ./internal/releaselab ./internal/releasecms

