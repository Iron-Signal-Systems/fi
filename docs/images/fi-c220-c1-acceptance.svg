="Segoe UI,Arial,sans-serif" font-size="17" fill="#c1d6e9"  text-anchor="start">Trust + manifest</text><rect x="384" y="220" width="281" height="224" rx="22" fill="url(#cell)" stroke="#5be2b7" stroke-width="2"/><rect x="404" y="242" width="6" height="42" rx="3" fill="#5be2b7"/><text x="423" y="263" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#5be2b7" font-weight="700" text-anchor="start">P5  /  PREPARE</text><text x="413" y="299" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#fff" font-weight="700" text-anchor="start">Read + plan</text><text x="411" y="337" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#c1d6e9"  text-anchor="start">Signed batch source</text><text x="411" y="368" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#c1d6e9"  text-anchor="start">SourceParent order</text><text x="411" y="399" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#c1d6e9"  text-anchor="start">Prepare once</text><rect x="719" y="220" width="281" height="224" rx="22" fill="url(#cell)" stroke="#5be2b7" stroke-width="2"/><rect x="739" y="242" width="6" height="42" rx="3" fill="#5be2b7"/><text x="758" y="263" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#5be2b7" font-weight="700" text-anchor="start">P6  /  PROCESS</text><text x="748" y="299" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#fff" font-weight="700" text-anchor="start">Five families</text><text x="746" y="337" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#c1d6e9"  text-anchor="start">Adaptive SQL workers</text><text x="746" y="368" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#c1d6e9"  text-anchor="start">Coverage + Security</text><text x="746" y="399" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#c1d6e9"  text-anchor="start">File + USN / others</text><rect x="1054" y="220" width="279" height="224" rx="22" fill="url(#cell)" stroke="#5be2b7" stroke-width="2"/><rect x="1074" y=